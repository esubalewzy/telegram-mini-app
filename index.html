<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Essential RMNCH Service Reporting Feedback System</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Marked.js for parsing Markdown tables & formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* Table Styling for Markdown Output */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .markdown-body th {
      background-color: #1f4e78;
      color: #ffffff;
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      text-align: left;
    }
    .markdown-body td {
      padding: 0.5rem;
      border: 1px solid #e2e8f0;
    }
    .markdown-body tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      font-weight: 700;
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Navigation Bar -->
  <header class="bg-blue-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-hospital-user text-2xl text-blue-300"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">RMNCH Analytics & Feedback Hub</h1>
          <p class="text-xs text-blue-200">Automated Weekly Health Monitoring System</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs bg-blue-800 px-3 py-1.5 rounded-lg border border-blue-700">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Google Sheets Connected</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Sidebar Filters & Export Actions -->
    <aside class="lg:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-5 h-fit">
      <div>
        <h2 class="text-base font-semibold text-slate-900 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-filter text-blue-600"></i> Report Controls
        </h2>

        <!-- Zone Selector -->
        <label class="block text-xs font-medium text-slate-600 mb-1">Target Zone</label>
        <select id="zoneSelect" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none mb-3">
          <option value="Grand Total">Grand Total (All Zones)</option>
        </select>

        <!-- Week Selector -->
        <label class="block text-xs font-medium text-slate-600 mb-1">Reporting Week</label>
        <select id="weekSelect" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none mb-4">
          <option value="All Weeks">All Weeks</option>
        </select>

        <!-- Generate Full Report Button -->
        <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI Analysis
        </button>
      </div>

      <hr class="border-slate-200" />

      <!-- Export Options -->
      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Export Tools</h3>
        <button id="exportDocxBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm disabled:opacity-50" disabled>
          <i class="fa-solid fa-file-word text-blue-400"></i> Export to Word (.docx)
        </button>
      </div>
    </aside>

    <!-- Main Output & Interactive Interface -->
    <section class="lg:col-span-3 flex flex-col gap-4">

      <!-- Display Box -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col min-h-[500px]">
        <!-- Box Header -->
        <div class="border-b border-slate-200 px-6 py-4 flex justify-between items-center bg-slate-50/50 rounded-t-xl">
          <h2 class="font-semibold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-blue-600"></i> Analytics Feedback Output
          </h2>
          <span id="statusBadge" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full border border-slate-200">Ready</span>
        </div>

        <!-- Output Content Area -->
        <div id="reportOutput" class="p-6 overflow-y-auto flex-1 markdown-body text-slate-700 leading-relaxed">
          <div class="h-full flex flex-col items-center justify-center text-slate-400 gap-3 py-16">
            <i class="fa-solid fa-file-invoice text-4xl text-slate-300"></i>
            <p class="text-sm">Select a Zone and Week, then click <strong>"Generate AI Analysis"</strong> to produce the feedback report.</p>
          </div>
        </div>
      </div>

      <!-- Quick Prompt Input Box -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-2 items-center">
        <input type="text" id="customPrompt" placeholder="Ask follow-up questions or refine performance indicators..." class="flex-1 bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        <button id="sendPromptBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors flex items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Send
        </button>
      </div>

    </section>

  </main>

  <!-- JavaScript Integration -->
  <script>
    let currentRawMarkdown = "";

    // Load available dynamic filters from backend on page startup
    async function loadFilters() {
      try {
        const response = await fetch('/api/filters');
        const data = await response.json();

        const zoneSelect = document.getElementById('zoneSelect');
        const weekSelect = document.getElementById('weekSelect');

        if (data.zones && data.zones.length > 0) {
          data.zones.forEach(zone => {
            const option = document.createElement('option');
            option.value = zone;
            option.textContent = zone;
            zoneSelect.appendChild(option);
          });
        }

        if (data.weeks && data.weeks.length > 0) {
          data.weeks.forEach(week => {
            const option = document.createElement('option');
            option.value = week;
            option.textContent = week;
            weekSelect.appendChild(option);
          });
        }
      } catch (err) {
        console.error("Failed to load spreadsheet filters:", err);
      }
    }

    // Trigger report request
    async function fetchReport(userPrompt = null) {
      const zone = document.getElementById('zoneSelect').value;
      const week = document.getElementById('weekSelect').value;
      const reportOutput = document.getElementById('reportOutput');
      const statusBadge = document.getElementById('statusBadge');
      const exportBtn = document.getElementById('exportDocxBtn');

      statusBadge.textContent = "Analyzing...";
      statusBadge.className = "text-xs bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full border border-amber-200 animate-pulse";

      reportOutput.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 py-16">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600"></i>
          <p class="text-sm font-medium">Fetching sheet data and running Groq AI analysis...</p>
        </div>
      `;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userPrompt || "Generate full report with all indicator categories and dedicated HSTP-II benchmarking section.",
            selectedZone: zone,
            selectedWeek: week
          })
        });

        const data = await response.json();
        currentRawMarkdown = data.reply || "No feedback generated.";

        // Render formatted Markdown Output
        reportOutput.innerHTML = marked.parse(currentRawMarkdown);

        statusBadge.textContent = "Complete";
        statusBadge.className = "text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full border border-emerald-200";

        // Enable Word Export Button
        exportBtn.disabled = false;

      } catch (err) {
        reportOutput.innerHTML = `<div class="text-red-500 p-4">Error loading report: ${err.message}</div>`;
        statusBadge.textContent = "Error";
        statusBadge.className = "text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded-full border border-red-200";
      }
    }

    // Handle Word Export
    async function downloadWordDoc() {
      if (!currentRawMarkdown) return;

      const zone = document.getElementById('zoneSelect').value;
      const week = document.getElementById('weekSelect').value;
      const title = `Weekly RMNCH Feedback - ${zone} (${week})`;

      try {
        const response = await fetch('/api/export-docx', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reportText: currentRawMarkdown, title: title })
        });

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `RMNCH_Report_${zone}_${week}.docx`.replace(/\s+/g, '_');
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        alert("Failed to export Word document: " + err.message);
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      loadFilters();

      document.getElementById('generateBtn').addEventListener('click', () => fetchReport());
      document.getElementById('exportDocxBtn').addEventListener('click', downloadWordDoc);

      document.getElementById('sendPromptBtn').addEventListener('click', () => {
        const promptInput = document.getElementById('customPrompt');
        if (promptInput.value.trim()) {
          fetchReport(promptInput.value.trim());
          promptInput.value = '';
        }
      });
    });
  </script>
</body>
</html>
