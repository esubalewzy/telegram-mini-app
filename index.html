<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .dashboard-container {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 350px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 12px;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .user-message {
      align-self: flex-end;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .bot-message {
      align-self: flex-start;
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000000);
    }
    .input-area {
      display: flex;
      padding: 8px;
      gap: 8px;
      border-top: 1px solid var(--tg-theme-hint-color, #ccc);
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      outline: none;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    button {
      padding: 10px 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Analytics Dashboard</h2>
    <div class="dashboard-container">
      <!-- Looker Studio embed URL -->
      <iframe src="https://datastudio.google.com/embed/reporting/b2b4381a-5a44-47f1-a407-49fa6b987bda/page/p_2g7d85cb8d" allowfullscreen></iframe>
    </div>

    <h3>Ask Assistant</h3>
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div class="message bot-message">Hello! Ask me anything about your analytics metrics.</div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatBox = document.getElementById('chatBox');
      const message = inputEl.value.trim();

      if (!message || sendBtn.disabled) return;

      // Add user message to UI
      appendMessage(message, 'user-message');
      inputEl.value = '';

      // Lock UI to prevent spam/double-clicks
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Add loading state message
      const loadingDiv = appendMessage('Thinking...', 'bot-message');

      try {
        const user = tg?.initDataUnsafe?.user || {};
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, user })
        });

        const data = await response.json();
        loadingDiv.textContent = data.reply || 'No response received.';
      } catch (err) {
        loadingDiv.textContent = 'Network error. Please try again.';
      } finally {
        // Re-enable input controls
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
