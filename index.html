<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWERHB RMNCH Analytics</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    select {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      font-weight: 600;
    }
    .dashboard-container {
      width: 100%;
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    iframe { width: 100%; height: 100%; border: 0; }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 380px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 12px;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user-message {
      align-self: flex-end;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: #fff;
    }
    .bot-message {
      align-self: flex-start;
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    .input-area {
      display: flex;
      padding: 8px;
      gap: 8px;
      border-top: 1px solid var(--tg-theme-hint-color, #ccc);
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-docx {
      background-color: #2b579a;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h2>SWERHB RMNCH Analytics Dashboard</h2>
    
    <div class="filter-bar">
      <select id="zoneSelect">
        <option value="Grand Total">Grand Total (All Zones)</option>
      </select>

      <select id="weekSelect">
        <option value="All Weeks">All Weeks</option>
      </select>
    </div>

    <div class="dashboard-container">
      <iframe src="https://datastudio.google.com/embed/reporting/b2b4381a-5a44-47f1-a407-49fa6b987bda/page/p_2g7d85cb8d" allowfullscreen></iframe>
    </div>

    <h3>RMNCH AI Assistant</h3>
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div class="message bot-message">Loading live zones and weeks...</div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question or request analysis..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Analyze</button>
        <button id="docxBtn" class="btn-docx" onclick="downloadDocx()" disabled>Download Word Report</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let lastReportText = "";

    async function loadFilters() {
      try {
        const res = await fetch('/api/filters');
        const data = await res.json();
        
        const zoneSelect = document.getElementById('zoneSelect');
        const weekSelect = document.getElementById('weekSelect');

        data.zones.forEach(zone => {
          const opt = document.createElement('option');
          opt.value = zone;
          opt.textContent = zone;
          zoneSelect.appendChild(opt);
        });

        data.weeks.forEach(week => {
          const opt = document.createElement('option');
          opt.value = week;
          opt.textContent = week;
          weekSelect.appendChild(opt);
        });

        document.getElementById('chatBox').innerHTML = '<div class="message bot-message">Select a Zone and Week above, then click Analyze.</div>';
      } catch (err) {
        console.error('Failed to load filters:', err);
      }
    }

    loadFilters();

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const docxBtn = document.getElementById('docxBtn');
      const chatBox = document.getElementById('chatBox');
      const zoneSelect = document.getElementById('zoneSelect');
      const weekSelect = document.getElementById('weekSelect');

      const message = inputEl.value.trim() || `Generate full RMNCH report.`;

      appendMessage(message, 'user-message');
      inputEl.value = '';

      inputEl.disabled = true;
      sendBtn.disabled = true;
      docxBtn.disabled = true;

      const loadingDiv = appendMessage('Processing data and auditing Hepatitis BD & comparative performance...', 'bot-message');

      try {
        const user = tg?.initDataUnsafe?.user || {};
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            selectedZone: zoneSelect.value,
            selectedWeek: weekSelect.value,
            user
          })
        });

        const data = await response.json();
        lastReportText = data.reply || 'No report generated.';
        loadingDiv.textContent = lastReportText;
        docxBtn.disabled = false;
      } catch (err) {
        loadingDiv.textContent = 'Error fetching analysis.';
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    async function downloadDocx() {
      if (!lastReportText) return;
      
      const zoneSelect = document.getElementById('zoneSelect');
      const weekSelect = document.getElementById('weekSelect');
      
      const response = await fetch('/api/export-docx', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reportText: lastReportText,
          title: `RMNCH Report - ${zoneSelect.value} (${weekSelect.value})`
        })
      });

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `RMNCH_Report_${zoneSelect.value}_${weekSelect.value}.docx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
